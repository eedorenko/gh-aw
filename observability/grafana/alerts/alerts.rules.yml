# GENERATED by tools/generate.mjs from definitions/slo.mjs; do not edit by hand.
# One rule per breached SLO. Thresholds come from the SLI table. Tier A metrics only.
groups:
  - name: gh-aw-slo
    rules:
      - alert: GhAwFleetSilent
        expr: |
          ((round(sum(increase(gh_aw_job_duration_seconds_count[6h])))) or vector(0)) < 1
        for: 0m
        labels:
          severity: warning
          sli: A1
        annotations:
          summary: "No gh-aw jobs reported in 6 hours"
          description: "Either nothing ran or telemetry is broken; check A4 on the SLO overview. SLO: ≥ 1."

      - alert: GhAwTimedOutJobs
        expr: |
          (((sum(increase(gh_aw_job_duration_seconds_count{cicd_pipeline_task_run_result="timed_out"}[6h]))) / ((sum(increase(gh_aw_job_duration_seconds_count{cicd_pipeline_task_run_result!="cancelled"}[6h]))) > 0)) or (((sum(increase(gh_aw_job_duration_seconds_count{cicd_pipeline_task_run_result!="cancelled"}[6h]))) > 0) * 0)) > 0.02 and on() (sum(increase(gh_aw_job_duration_seconds_count[6h])) >= 5)
        for: 15m
        labels:
          severity: warning
          sli: A2
        annotations:
          summary: "gh-aw timeout ratio above the 2% SLO"
          description: "Jobs are hitting their timeout. Open the Availability scan dashboard to see which workflows. SLO: ≤ 2% (amber ≤ 4%)."

      - alert: GhAwTelemetryBroken
        expr: |
          ((round(sum(increase(gh_aw_otlp_export_failures_total[15m])))) or vector(0)) > 0
        for: 15m
        labels:
          severity: warning
          sli: A4
        annotations:
          summary: "gh-aw is failing to export OTLP telemetry"
          description: "Dashboards may under-report until exports recover. SLO: ≤ 0."

      - alert: GhAwSlowAgentJobs
        expr: |
          (histogram_quantile(0.95, sum by (le) (increase(gh_aw_job_duration_seconds_bucket{gh_aw_job_name="agent"}[6h])))) > 1200 and on() (sum(increase(gh_aw_job_duration_seconds_count[6h])) >= 5)
        for: 30m
        labels:
          severity: warning
          sli: R1
        annotations:
          summary: "gh-aw agent job p95 duration above the 20 minute SLO"
          description: "Agent jobs are slow. Open the Responsiveness scan dashboard. SLO: ≤ 20 min (amber ≤ 25 min)."

      - alert: GhAwHighFailureRate
        expr: |
          (((sum(increase(gh_aw_job_duration_seconds_count{cicd_pipeline_task_run_result="success"}[1h]))) / ((sum(increase(gh_aw_job_duration_seconds_count{cicd_pipeline_task_run_result!="cancelled"}[1h]))) > 0)) or (((sum(increase(gh_aw_job_duration_seconds_count{cicd_pipeline_task_run_result!="cancelled"}[1h]))) > 0) * 0)) < 0.95 and on() (sum(increase(gh_aw_job_duration_seconds_count[1h])) >= 5)
        for: 15m
        labels:
          severity: warning
          sli: Q1
        annotations:
          summary: "gh-aw job success ratio below the 95% SLO"
          description: "Open the Quality scan dashboard to see which workflows are failing. SLO: ≥ 95% (amber ≥ 90%)."

      - alert: GhAwHighIncompleteRate
        expr: |
          (((sum(increase(gh_aw_workflow_output_items_total{gh_aw_safe_output_type="report_incomplete"}[6h]))) / ((sum(increase(gh_aw_job_duration_seconds_count{gh_aw_job_name="agent"}[6h]))) > 0)) or (((sum(increase(gh_aw_job_duration_seconds_count{gh_aw_job_name="agent"}[6h]))) > 0) * 0)) > 0.05 and on() (sum(increase(gh_aw_job_duration_seconds_count[6h])) >= 5)
        for: 30m
        labels:
          severity: warning
          sli: Q3
        annotations:
          summary: "More than 5% of gh-aw agent runs end as incomplete"
          description: "Agents are reporting they could not finish. Open the Quality scan dashboard. SLO: ≤ 5% (amber ≤ 10%)."

      - alert: GhAwTokenBurnSpike
        expr: |
          ((((sum(increase(gen_ai_client_token_usage_total{gen_ai_token_type="input"}[1d])) + sum(increase(gen_ai_client_token_usage_total{gen_ai_token_type="output"}[1d])))) / (((sum(increase(gen_ai_client_token_usage_total{gen_ai_token_type="input"}[7d])) + sum(increase(gen_ai_client_token_usage_total{gen_ai_token_type="output"}[7d]))) / 7) > 0)) or ((((sum(increase(gen_ai_client_token_usage_total{gen_ai_token_type="input"}[7d])) + sum(increase(gen_ai_client_token_usage_total{gen_ai_token_type="output"}[7d]))) / 7) > 0) * 0)) > 2
        for: 1h
        labels:
          severity: warning
          sli: C2
        annotations:
          summary: "gh-aw token burn over 2x the 7-day daily average"
          description: "Open the Cost scan dashboard to see which workflows are burning tokens. SLO: ≤ 2× (amber ≤ 3×)."
